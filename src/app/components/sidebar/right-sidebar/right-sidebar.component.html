<aside class="bg-tttGray-900 border-tttGray-800 border-l lg:w-64">
    <div class="space-y-6 p-6">
        <div>
            <ttt-section-header
                title="Live Discord"
                containerClass="mb-4"
                titleClass="text-tttWhite text-lg font-bold"
            ></ttt-section-header>
            <ttt-discord-widget></ttt-discord-widget>
        </div>

        <div>
            <ttt-section-header
                title="Live TeamSpeak"
                containerClass="mb-4"
                titleClass="text-tttWhite text-lg font-bold"
            ></ttt-section-header>
            <div class="bg-tttGray-800 border-tttGray-700 overflow-hidden rounded-lg border">
                <iframe
                    [src]="teamspeakStatusUrl"
                    width="100%"
                    height="300"
                    sandbox="allow-popups allow-same-origin allow-scripts"
                    class="w-full border-0"
                    title="TTT TeamSpeak Server"
                ></iframe>
                <div class="p-4 text-center">
                    <a [href]="teamspeakUrl" class="ttt-btn-primary">TS3 beitreten</a>
                </div>
            </div>
        </div>
    </div>
</aside>
