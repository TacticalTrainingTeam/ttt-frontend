<div class="mb-8">
    <ttt-section-header title="TTT-Timeline" subtitle="Meilensteine des Tactical Training Teams"></ttt-section-header>

    <p-timeline [value]="timelineEvents()" align="alternate" styleClass="ttt-chronik-timeline">
        <ng-template #marker let-event>
            <span class="border-tttRed/50 bg-tttGray-800 flex h-8 w-8 items-center justify-center rounded-full border shadow-md">
                <i class="pi text-sm" [ngClass]="[getEventTypeIcon(event.type), event.color]" aria-hidden="true"></i>
            </span>
        </ng-template>

        <ng-template #opposite let-event>
            <span class="text-tttGray-300 hidden text-sm sm:inline">{{ event.date }}</span>
        </ng-template>

        <ng-template #content let-event>
            <div class="ttt-content-card mb-6 p-3 text-left" [ngClass]="{ 'border-tttRed/70': event.expanded }">
                <div class="mb-1 flex flex-wrap items-center gap-2">
                    <h3 class="text-tttWhite text-base font-bold" [title]="event.title">{{ event.title }}</h3>
                    <span class="text-xs font-medium" [ngClass]="event.color">{{ getEventTypeLabel(event.type) }}</span>
                </div>
                <p class="text-tttGray-300 mb-1 text-sm sm:hidden">{{ event.date }}</p>
                <p class="text-tttGray-300 text-sm leading-snug">{{ event.description }}</p>

                @if (event.details && event.details.length > 0) {
                    <button
                        pButton
                        type="button"
                        [text]="true"
                        size="small"
                        class="text-tttRed mt-2 px-0"
                        (click)="toggleEventDetails(event)"
                        [attr.aria-label]="'Details fuer ' + event.title + (event.expanded ? ' ausblenden' : ' anzeigen')"
                        [attr.aria-expanded]="event.expanded"
                    >
                        <i
                            class="pi text-xs"
                            [class.pi-chevron-down]="!event.expanded"
                            [class.pi-chevron-up]="event.expanded"
                            aria-hidden="true"
                        ></i>
                        <span>Weitere Details</span>
                    </button>

                    @if (event.expanded) {
                        <ul class="mt-2 space-y-1">
                            @for (detail of event.details; track detail) {
                                <li class="text-tttGray-300 flex items-start gap-2 text-sm">
                                    <i class="pi pi-angle-right text-tttRed mt-0.5 flex-shrink-0 text-sm" aria-hidden="true"></i>
                                    <span>{{ detail }}</span>
                                </li>
                            }
                        </ul>
                    }
                }
            </div>
        </ng-template>
    </p-timeline>
</div>
