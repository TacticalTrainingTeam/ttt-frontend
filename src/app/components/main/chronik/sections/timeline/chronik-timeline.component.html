<div class="mb-8">
    <ttt-section-header title="TTT-Timeline" subtitle="Meilensteine des Tactical Training Teams"></ttt-section-header>

    <div class="grid grid-cols-2 items-stretch gap-4 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5">
        @for (event of timelineEvents; track event.id) {
            <div class="relative h-full">
                <button
                    type="button"
                    class="group ttt-content-card relative flex h-full min-h-[110px] flex-col justify-between p-2 text-left shadow-md"
                    [ngClass]="{
                        'bg-tttRed/10 border-tttRed/70': event.expanded,
                    }"
                    (click)="toggleEventDetails(event)"
                    (keydown)="handleEventKeyboard(event, $event)"
                    [attr.aria-label]="'Details fuer ' + event.title + (event.expanded ? ' ausblenden' : ' anzeigen')"
                    [attr.aria-expanded]="event.expanded"
                >
                    <div class="mb-1 min-w-0">
                        <h3
                            class="text-tttWhite max-w-[120px] truncate text-base font-bold transition-colors duration-200 md:max-w-[160px]"
                            [title]="event.title"
                        >
                            {{ event.title }}
                        </h3>
                    </div>
                    <div class="mb-1 flex min-w-0 flex-col items-center gap-1">
                        <span class="max-w-[100px] truncate rounded px-2 py-0.5 text-center text-sm font-medium" [ngClass]="event.color">
                            {{ getEventTypeLabel(event.type) }}
                        </span>
                        <span class="text-tttGray-300 text-center text-sm" [title]="event.date">{{ event.date }}</span>
                    </div>
                    <div class="mb-1">
                        <p class="text-tttGray-300 line-clamp-3 text-sm leading-snug">{{ event.description }}</p>
                    </div>
                    <div class="mt-1 flex justify-center">
                        <i
                            class="pi text-tttGray-500 text-xs transition-transform duration-200"
                            [class.pi-chevron-down]="!event.expanded"
                            [class.pi-chevron-up]="event.expanded"
                            aria-hidden="true"
                        ></i>
                    </div>
                </button>

                @if (event.expanded) {
                    <div class="ttt-content-card border-tttRed/70 animate-fadeIn absolute right-0 left-0 z-10 mt-2 p-3 shadow-xl">
                        <button
                            (click)="toggleEventDetails(event)"
                            class="bg-tttGray-800/70 absolute top-2 right-2 flex h-6 w-6 items-center justify-center rounded-full"
                            tabindex="-1"
                            aria-label="Details schliessen"
                        >
                            <i class="pi pi-times text-tttGray-300 text-sm" aria-hidden="true"></i>
                        </button>
                        @if (event.details && event.details.length > 0) {
                            <div>
                                <h4 class="text-tttWhite mb-1 text-sm font-semibold tracking-wide uppercase">Weitere Details:</h4>
                                <ul class="space-y-1">
                                    <li *ngFor="let detail of event.details" class="text-tttGray-300 flex items-start gap-2 text-sm">
                                        <i class="pi pi-angle-right text-tttRed mt-0.5 flex-shrink-0 text-sm"></i>
                                        <span>{{ detail }}</span>
                                    </li>
                                </ul>
                            </div>
                        }
                    </div>
                }
            </div>
        }
    </div>
</div>
