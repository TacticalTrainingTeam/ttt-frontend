@if (isLoading()) {
    <div class="flex min-h-96 items-center justify-center">
        <div class="text-center">
            <p-progress-spinner styleClass="mb-4" strokeWidth="6" [style]="{ width: '3rem', height: '3rem' }" />
            <p class="text-tttWhite/70">{{ loadingMessages().LOADING }}</p>
        </div>
    </div>
}

@if (loadingError() && !isLoading()) {
    <div class="flex min-h-96 items-center justify-center">
        <div class="text-center">
            <h2 class="text-tttWhite mb-4 text-xl font-bold">{{ loadingMessages().ERROR_TITLE }}</h2>
            <p-message severity="error" icon="pi pi-exclamation-triangle" styleClass="mb-4">{{ loadingError() }}</p-message>
            <div>
                <button pButton type="button" (click)="onRetry()" class="ttt-btn-primary" [attr.aria-label]="loadingMessages().RETRY_ARIA">
                    <span>{{ loadingMessages().RETRY_TEXT }}</span>
                </button>
            </div>
        </div>
    </div>
}
