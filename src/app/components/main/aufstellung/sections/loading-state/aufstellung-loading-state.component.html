@if (isLoading) {
    <div class="flex min-h-96 items-center justify-center">
        <div class="text-center">
            <div class="border-tttGray-300 border-t-tttRed mb-4 inline-block h-12 w-12 animate-spin rounded-full border-4"></div>
            <p class="text-tttWhite/70">{{ loadingMessages.LOADING }}</p>
        </div>
    </div>
}

@if (loadingError && !isLoading) {
    <div class="flex min-h-96 items-center justify-center">
        <div class="text-center">
            <div class="mb-4 flex justify-center">
                <i class="pi pi-exclamation-triangle text-tttRed text-4xl" aria-hidden="true"></i>
            </div>
            <h2 class="text-tttWhite mb-2 text-xl font-bold">{{ loadingMessages.ERROR_TITLE }}</h2>
            <p class="text-tttWhite/70 mb-4">{{ loadingError }}</p>
            <button (click)="onRetry()" class="ttt-btn-primary" [attr.aria-label]="loadingMessages.RETRY_ARIA">
                <i class="pi pi-refresh" aria-hidden="true"></i>
                <span>{{ loadingMessages.RETRY_TEXT }}</span>
            </button>
        </div>
    </div>
}
