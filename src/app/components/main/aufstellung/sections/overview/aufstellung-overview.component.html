<section class="mb-6">
    <div class="ttt-page-container">
        <ttt-section-header [title]="title()" [subtitle]="subtitle()"></ttt-section-header>

        <div class="mb-6 grid grid-cols-2 gap-3 md:grid-cols-3 lg:grid-cols-6">
            @for (rank of rankOrder(); track rank) {
                <div
                    class="border-tttWhite/10 bg-tttGray-800/50 flex min-h-[88px] flex-col justify-center rounded-lg border p-2.5 text-center"
                >
                    <div class="mb-1.5 flex min-h-6 items-center justify-center gap-2 text-left">
                        <img
                            [src]="getRankInfo(rank).icon"
                            [alt]="getRankInfo(rank).name + ' Abzeichen'"
                            title="{{ getRankInfo(rank).name }}"
                            class="h-6 w-6 shrink-0 object-contain drop-shadow-[0_0_1px_rgba(255,255,255,0.15)]"
                            loading="lazy"
                        />
                        <h3 class="ttt-label m-0 leading-none">{{ getRankInfo(rank).name }}</h3>
                    </div>
                    <div class="text-xl leading-none font-bold" [ngClass]="getRankInfo(rank).color">
                        {{ memberStats()[rank] }}
                    </div>
                </div>
            }
        </div>
    </div>
</section>
