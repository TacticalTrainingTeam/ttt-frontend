<!-- Roster component -->
<ttt-page-layout [pageTitle]="pageTitle" [pageSubtitle]="pageSubtitle">
    <ttt-aufstellung-loading-state
        [isLoading]="isLoading"
        [loadingError]="loadingError"
        [loadingMessages]="loadingMessages"
        (retry)="retryLoading()"
    ></ttt-aufstellung-loading-state>

    @if (!isLoading && !loadingError) {
        <div>
            <ttt-aufstellung-overview
                [rankOrder]="rankOrder"
                [rankInfo]="rankInfo"
                [memberStats]="memberStats"
                [totalMembers]="totalMembers"
                [title]="sections.OVERVIEW.TITLE"
                [subtitle]="sections.OVERVIEW.SUBTITLE"
            ></ttt-aufstellung-overview>

            <ttt-aufstellung-roster
                [members]="members"
                [membersByRank]="membersByRank"
                [rankOrder]="rankOrder"
                [rankInfo]="rankInfo"
                [title]="sections.ROSTER.TITLE"
                [subtitle]="sections.ROSTER.SUBTITLE"
            ></ttt-aufstellung-roster>
        </div>
    }
</ttt-page-layout>
