<!-- Roster component -->
<ttt-page-layout [pageTitle]="pageTitle" [pageSubtitle]="pageSubtitle" [heroImage]="heroImage">
    <ttt-aufstellung-loading-state
        [isLoading]="isLoading()"
        [loadingError]="loadingError()"
        [loadingMessages]="loadingMessages"
        (retry)="retryLoading()"
    ></ttt-aufstellung-loading-state>

    @if (!isLoading() && !loadingError()) {
        <div>
            <ttt-aufstellung-overview
                [rankOrder]="rankOrder"
                [rankInfo]="rankInfo"
                [memberStats]="memberStats()"
                [totalMembers]="totalMembers()"
                [title]="sections.OVERVIEW.TITLE"
                [subtitle]="sections.OVERVIEW.SUBTITLE"
            ></ttt-aufstellung-overview>

            <!-- Abteilung filter for the roster below -->
            <div class="mb-4 flex justify-end">
                <p-select
                    [options]="abteilungOptions()"
                    optionLabel="name"
                    optionValue="id"
                    [ngModel]="selectedAbteilungId()"
                    (ngModelChange)="selectedAbteilungId.set($event)"
                    [showClear]="true"
                    placeholder="Nach Abteilung filtern"
                    ariaLabel="Roster nach Abteilung filtern"
                    styleClass="w-64"
                />
            </div>

            <ttt-aufstellung-roster
                [membersByRank]="membersByRank()"
                [rankOrder]="rankOrder"
                [rankInfo]="rankInfo"
                [title]="sections.ROSTER.TITLE"
                [subtitle]="sections.ROSTER.SUBTITLE"
            ></ttt-aufstellung-roster>
        </div>
    }
</ttt-page-layout>
