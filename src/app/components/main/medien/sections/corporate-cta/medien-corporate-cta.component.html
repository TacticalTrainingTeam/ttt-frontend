<!-- Corporate Design Section -->
<div class="mb-8">
    <ttt-section-header title="Corporate Design" subtitle="Logos, Richtlinien und offizielle Ressourcen"></ttt-section-header>

    <div class="grid grid-cols-1 gap-6">
        <ttt-external-link-tile
            [href]="wikiUrl()"
            title="Corporate Design Wiki"
            description="Offizielle Richtlinien für Logos, Farben und Design-Elemente"
            iconClass="pi pi-palette text-2xl"
            displayUrl="wiki.tacticalteam.de"
            ariaLabel="Corporate Design Wiki öffnen"
            cardClass="ttt-content-card ttt-card-interactive block text-left"
        ></ttt-external-link-tile>
    </div>
</div>

<!-- Call to Action -->
<div class="ttt-text-center">
    <div class="ttt-content-card px-6 py-8">
        <h2 class="ttt-subsection-title mb-3">Werde Teil unserer Community</h2>
        <p class="text-tttGray-200 mb-6">
            Folge uns auf deinen bevorzugten Plattformen und bleibe über unsere Aktivitäten, Events und neue Inhalte auf dem Laufenden. Jede
            Interaktion hilft uns dabei, die TTT-Community zu vergrößern!
        </p>
        <a pButton routerLink="/mitmachen" class="ttt-btn-primary px-6 py-3 text-lg"> Jetzt mitmachen </a>
    </div>
</div>
