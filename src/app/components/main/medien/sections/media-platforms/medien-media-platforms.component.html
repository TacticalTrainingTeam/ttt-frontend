<!-- Media Platforms Section -->
<div class="mb-8">
    <ttt-section-header
        title="Medien & Kanaele"
        subtitle="Unsere Videos, Podcasts und anderen Medien"
        iconClass="pi pi-play text-tttRed"
    ></ttt-section-header>

    <div class="grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-3">
        @for (platform of mediaPlatforms; track platform.id) {
            <ttt-external-link-tile
                [href]="platform.url"
                [title]="platform.name"
                [description]="platform.description"
                [iconClass]="platform.iconClass"
                [displayUrl]="platform.displayUrl"
                [ariaLabel]="platform.ariaLabel"
                [iconWrapperClass]="
                    'flex h-12 w-12 items-center justify-center rounded-lg transition-transform group-hover:scale-110 ' +
                    platform.iconWrapperClass
                "
                [cardClass]="'ttt-content-card group block text-left transition-all duration-300 ' + platform.cardClass"
            ></ttt-external-link-tile>
        }
    </div>
</div>
