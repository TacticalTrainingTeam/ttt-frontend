<!-- Social Media Section -->
<div class="mb-8">
    <div class="ttt-text-center mb-6">
        <h2 class="ttt-section-title mb-2 flex items-center justify-center gap-3">
            <i class="pi pi-share-alt text-tttRed"></i>
            Community & Plattformen
        </h2>
        <p class="ttt-description-text">Folge uns auf Social Media und anderen Plattformen</p>
    </div>

    <div class="grid grid-cols-2 gap-4 md:grid-cols-3 lg:grid-cols-4">
        @for (platform of socialPlatforms; track platform.id) {
            <a
                [href]="platform.url"
                target="_blank"
                rel="noopener noreferrer"
                class="ttt-content-card group block flex h-full cursor-pointer flex-col text-center transition-all duration-300"
                [ngClass]="platform.cardClass"
                [attr.aria-label]="platform.ariaLabel"
            >
                <div class="mb-3 flex justify-center">
                    <div
                        class="bg-tttGray-700/50 flex h-12 w-12 items-center justify-center rounded-full transition-transform group-hover:scale-110"
                    >
                        <i [ngClass]="platform.iconClass"></i>
                    </div>
                </div>
                <div class="flex flex-grow flex-col justify-center">
                    <h3 class="text-tttWhite group-hover:text-tttRed mb-1 font-semibold transition-colors">{{ platform.name }}</h3>
                    <p class="text-tttGray-300 text-sm leading-tight break-words">{{ platform.handle }}</p>
                </div>
            </a>
        }
    </div>
</div>
