<!-- Social Media Section -->
<div class="mb-8">
    <ttt-section-header title="Community & Plattformen" subtitle="Folge uns auf Social Media und anderen Plattformen"></ttt-section-header>

    <div class="grid grid-cols-2 gap-4 md:grid-cols-3 lg:grid-cols-4">
        @for (platform of socialPlatforms(); track platform.id) {
            <a
                [href]="platform.url"
                target="_blank"
                rel="noopener noreferrer"
                class="ttt-content-card block flex h-full cursor-pointer flex-col text-center"
                [ngClass]="platform.cardClass"
                [attr.aria-label]="platform.ariaLabel"
            >
                <div class="mb-3 flex justify-center">
                    <div class="ttt-icon-tile">
                        <i [ngClass]="platform.iconClass"></i>
                    </div>
                </div>
                <div class="flex flex-grow flex-col justify-center">
                    <h3 class="ttt-label mb-1">{{ platform.name }}</h3>
                    <p class="text-tttGray-300 text-sm leading-tight break-words">{{ platform.handle }}</p>
                </div>
            </a>
        }
    </div>
</div>
