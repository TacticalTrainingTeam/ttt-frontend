<!-- Live Streams Section -->
<div class="mb-8">
    <ttt-section-header title="Livestreams" subtitle="Aktuelle Live-Übertragungen unserer Community"></ttt-section-header>

    @if (liveStreams$() | async; as liveStreams) {
        <div class="grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-3">
            @for (stream of liveStreams; track stream.id) {
                <a
                    class="ttt-content-card ttt-card-interactive cursor-pointer"
                    [attr.aria-label]="'Live Stream öffnen: ' + stream.title"
                    [href]="stream.url"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <div class="relative mb-4">
                        <img
                            [src]="stream.thumbnailUrl"
                            [alt]="stream.title || 'Livestream Thumbnail'"
                            title="{{ stream.title }}"
                            class="h-48 w-full rounded-lg object-cover"
                        />
                        <div class="absolute inset-0 rounded-lg bg-black/40"></div>
                        <div class="absolute top-3 left-3">
                            <span class="bg-tttRed/90 inline-flex items-center gap-1 rounded-full px-2 py-1 text-xs font-medium text-white">
                                <i class="pi pi-circle-fill animate-pulse"></i>
                                LIVE
                            </span>
                        </div>
                        <div class="absolute bottom-3 left-3">
                            <span class="inline-flex items-center gap-1 rounded-full bg-black/70 px-2 py-1 text-xs font-medium text-white">
                                <i class="pi pi-eye"></i>
                                {{ stream.viewerCount }}
                            </span>
                        </div>
                    </div>

                    <div class="space-y-2">
                        <h3 class="ttt-card-title mb-1 line-clamp-2">
                            {{ stream.title }}
                        </h3>
                        <p class="text-tttGray-300 text-base">
                            <i class="pi pi-user mr-1"></i>
                            {{ stream.userName }}
                        </p>
                    </div>
                </a>
            }
        </div>
    }

    @if ((liveStreams$() | async)?.length === 0) {
        <div class="py-12 text-center">
            <div class="mb-4">
                <i class="pi pi-video text-tttGray-600 text-4xl"></i>
            </div>
            <h3 class="ttt-card-title mb-1">Keine Livestreams</h3>
            <p class="text-tttGray-300">Derzeit sind keine Live-Übertragungen aktiv.</p>
        </div>
    }
</div>
